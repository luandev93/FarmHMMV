version: "3.9"

# ============================================================
# docker-compose.yml — medHMMV
# Ambiente local: Postgres + Redis + serviço Médico
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medico
      POSTGRES_PASSWORD: medico_dev
      POSTGRES_DB: medico_hmmv
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medico -d medico_hmmv"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  medico:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: ******postgres:5432/medico_hmmv?schema=public
      JWT_SECRET: dev-insecure-secret-troque-em-producao
      MED_API_KEY: dev-api-key
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
